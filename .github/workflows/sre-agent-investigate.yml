name: SRE Agent controlled investigation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      incident-id:
        description: Controlled synthetic incident identifier (must start with SYNTHETIC-)
        required: true
        type: string

permissions: {}

jobs:
  investigate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.label.name == 'sre-investigate' &&
        contains(github.event.issue.labels.*.name, 'sre-investigate') &&
        startsWith(github.event.issue.title, '[SYNTHETIC]')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Build safe trigger payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          INCIDENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs['incident-id'] || format('SYNTHETIC-ISSUE-{0}', github.event.issue.number) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && ! "$INCIDENT_ID" =~ ^SYNTHETIC-[A-Za-z0-9._-]+$ ]]; then
            echo "incident-id must match ^SYNTHETIC-[A-Za-z0-9._-]+$" >&2
            exit 1
          fi

          jq -n \
            --arg source "$EVENT_NAME" \
            --arg incidentId "$INCIDENT_ID" \
            --arg repository "$REPOSITORY" \
            --arg issueNumber "$ISSUE_NUMBER" \
            --arg title "$ISSUE_TITLE" \
            --arg body "$ISSUE_BODY" \
            --arg url "$ISSUE_URL" \
            '{
              source:$source,
              incidentId:$incidentId,
              repository:$repository,
              issueNumber:$issueNumber,
              title:$title,
              body:$body,
              url:$url,
              dataClassification:"synthetic"
            }' \
            > "$RUNNER_TEMP/sre-payload.json"

      - name: Trigger Review-mode investigation
        env:
          SRE_TRIGGER_URL: ${{ secrets.SRE_TRIGGER_URL }}
        run: |
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/sre-response.json" --write-out '%{http_code}' \
            --request POST "$SRE_TRIGGER_URL" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/sre-payload.json")"
          test "$status" = "202" || { echo "Expected HTTP 202, received $status" >&2; exit 1; }
          jq -e '.success == true and (.threadId | type == "string" and length > 0)' "$RUNNER_TEMP/sre-response.json"
